location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/euro-office/documentserver-example$1;
  index docker.html;
}

location /example/ {
  proxy_pass http://example/;
  proxy_set_header Accept-Encoding "";
  sub_filter_once off;
  sub_filter 'images/logo.svg' 'images/w4-office-white.svg';
  sub_filter 'images/mobile-logo_eo.svg' 'images/w4-office-white.svg';
  sub_filter 'images/favicon_eo.svg' 'images/w4-icon.svg';
  sub_filter 'alt="ONLYOFFICE"' 'alt="W4 Office"';
  sub_filter 'Euro-Office Document editors' 'W4 Office Document editors';
  sub_filter ' - Euro-Office</title>' ' - W4 Office</title>';
  sub_filter 'event.data.title + " - Euro-Office";' 'event.data.title + " - W4 Office";';
  sub_filter 'Euro-Office Docs' 'W4 Office';
  sub_filter 'alt="Euro-Office"' 'alt="W4 Office"';
  proxy_intercept_errors on;
  error_page 502 503 504 /welcome/example-disabled.html;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /example;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /example/images/w4-office-white.svg {
  default_type image/svg+xml;
  alias /var/www/euro-office/documentserver-example/welcome/w4-office-white.svg;
}

location = /example/images/w4-icon.svg {
  default_type image/svg+xml;
  alias /var/www/euro-office/documentserver-example/welcome/w4-icon.svg;
}
