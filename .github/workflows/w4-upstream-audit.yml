name: W4 upstream audit

on:
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w4-upstream-audit.yml'
      - '.github/scripts/w4-upstream-audit.py'

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.repository == 'W4MEX/W4-OfficeServer' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream changes and check W4 branding sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/w4-upstream-audit.py w4-upstream-report.md
          cat w4-upstream-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w4-upstream-report
          path: w4-upstream-report.md
          if-no-files-found: error
